<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bird Slow — Xeno-canto × RNBO</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header>
      <h1>Bird Slow</h1>
      <p class="subtitle">Xeno-canto → RNBO</p>
    </header>

    <section class="panel">
      <div class="row">
        <button id="startButton" class="primary">Activer l'audio</button>
        <button id="newBirdButton" disabled>Nouvel oiseau</button>
        <span id="status" class="status">Chargement de RNBO…</span>
      </div>

      <div class="bird-card">
        <div class="bird-title" id="birdName">—</div>
        <div id="birdEnglish">—</div>
        <div id="birdMeta">—</div>
        <a id="birdLink" href="#" target="_blank" rel="noopener">Voir l'enregistrement Xeno-canto</a>
      </div>

      <div class="control">
        <label for="slowdown">
          Vitesse
          <output id="slowdownValue">0.30×</output>
        </label>
        <input id="slowdown" type="range" min="0" max="2" step="0.01" value="0.3">
      </div>

      <div id="params" class="params">
        <h2>Paramètres RNBO</h2>
      </div>

      <details>
        <summary>Diagnostic</summary>
        <pre id="diagnostics"></pre>
      </details>
    </section>

    <footer>
      <span>Audio : Xeno-canto</span>
      <span>DSP : RNBO 1.2.6</span>
    </footer>
  </main>

  <script src="config.js"></script>
  <script src="https://cdn.cycling74.com/rnbo/1.2.6/rnbo.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
